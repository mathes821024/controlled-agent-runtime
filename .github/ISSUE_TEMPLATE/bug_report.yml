name: Bug report
description: Report a reproducible defect using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected controlled behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include secrets, private payloads, or personal data.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Trust boundary and possible impact
    validations:
      required: true

