name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo extras
        run: python3 -m pip install -e ".[demo]"
      - name: Validate repository contracts
        run: python3 scripts/validate_repository.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

