[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agent-runtime"
version = "0.0.0"
description = "Evidence-first policy control plane for AI-assisted actions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Controlled Agent Runtime contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
demo = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
agent = [
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]

[project.scripts]
controlled-agent-validate = "controlled_agent_runtime.validation:main"
controlled-agent-demo = "controlled_agent_runtime.demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

