name: Feature request
description: Propose a bounded contract or capability change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and trust-boundary impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals

